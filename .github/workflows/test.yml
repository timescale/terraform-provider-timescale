# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
# No paths filter here: Build and generate are required checks and must report even on docs-only
# changes. The jobs below skip themselves instead, and a skipped job satisfies a required check.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Decide which jobs the changed files need.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docs: ${{ steps.filter.outputs.docs }}
      acceptance: ${{ steps.filter.outputs.acceptance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go: &go
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'
              - '.golangci.yml'
              - '.github/workflows/test.yml'
            docs:
              - *go
              - 'docs/**'
              - 'examples/**'
              - 'templates/**'
              - 'GNUmakefile'
            acceptance:
              - 'internal/**'
              - 'main.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/test.yml'

  # Ensure project builds before running testing matrix
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'pull_request' && needs.changes.outputs.acceptance == 'true'
    # Don't run multiple acceptance tests simultaneously to avoid conflicts (f.e. VPCs).
    # Never cancel a run in progress: it skips the post-test destroy and leaves services behind.
    # Skipped runs get their own group so they never cancel a pending acceptance run.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && needs.changes.outputs.acceptance == 'true' && format('{0}-acceptance', github.workflow) || format('{0}-skip-{1}', github.workflow, github.run_id) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - '1.*.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      # Sweepers
      - env:
          TF_ACC: "1"
          TF_VAR_ts_access_key: ${{ secrets.TF_VAR_TS_ACCESS_KEY }}
          TF_VAR_ts_secret_key: ${{ secrets.TF_VAR_TS_SECRET_KEY }}
          TF_VAR_ts_project_id: ${{ secrets.TF_VAR_TS_PROJECT_ID }}
          PEER_ACCOUNT_ID: ${{ secrets.PEER_ACCOUNT_ID }}
          PEER_VPC_ID: ${{ secrets.PEER_VPC_ID }}
          PEER_TGW_ID: ${{ secrets.PEER_TGW_ID }}
          PEER_REGION: ${{ secrets.PEER_REGION }}
        run: go test ./internal/provider/ -v -timeout=30m -sweep=all
      - env:
          TF_ACC: "1"
          TF_LOG: ${{ runner.debug == '1' && 'DEBUG' || '' }}
          TF_VAR_ts_access_key: ${{ secrets.TF_VAR_TS_ACCESS_KEY }}
          TF_VAR_ts_secret_key: ${{ secrets.TF_VAR_TS_SECRET_KEY }}
          TF_VAR_ts_project_id: ${{ secrets.TF_VAR_TS_PROJECT_ID }}
          PEER_ACCOUNT_ID: ${{ secrets.PEER_ACCOUNT_ID }}
          PEER_VPC_ID: ${{ secrets.PEER_VPC_ID }}
          PEER_TGW_ID: ${{ secrets.PEER_TGW_ID }}
          PEER_REGION: ${{ secrets.PEER_REGION }}
        run: go test ./internal/provider/ -v -cover -timeout=60m
